<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Thống kê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-wallet2"></i> Chi Tiêu
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
            <a class="nav-link text-white" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Trang chủ
            </a>
            <a class="nav-link text-white" th:href="@{/transactions}">
                <i class="bi bi-list-ul"></i> Giao dịch
            </a>
            <a class="nav-link text-white" th:href="@{/categories}">
                <i class="bi bi-tags"></i> Danh mục
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name"></span>
            </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h5 class="fw-bold mb-3">
        <i class="bi bi-bar-chart"></i> Thống kê chi tiêu
    </h5>

    <!-- Bộ lọc thời gian -->
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
        <form th:action="@{/statistics}" method="get" class="row g-2 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-medium">Từ ngày</label>
                <input type="date" name="startDate" class="form-control form-control-sm"
                       th:value="${startDate}">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-medium">Đến ngày</label>
                <input type="date" name="endDate" class="form-control form-control-sm"
                       th:value="${endDate}">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-search"></i> Xem thống kê
                </button>
            </div>
        </form>
    </div>

    <!-- Tổng quan -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 p-3 text-center">
                <div class="text-muted small">Tổng chi tiêu</div>
                <div class="fw-bold text-danger fs-4"
                     th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                    0 ₫
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 p-3 text-center">
                <div class="text-muted small">Số giao dịch</div>
                <div class="fw-bold text-primary fs-4"
                     th:text="${transactionCount} + ' giao dịch'">
                    0 giao dịch
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <!-- Biểu đồ tròn theo danh mục -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 p-3">
                <h6 class="fw-bold mb-3">
                    <i class="bi bi-pie-chart"></i> Chi tiêu theo danh mục
                </h6>
                <canvas id="categoryChart" height="300"></canvas>

                <!-- Bảng chi tiết -->
                <table class="table table-sm mt-3">
                    <tbody>
                    <tr th:each="entry : ${categoryTotals}">
                        <td th:text="${entry.key}"></td>
                        <td class="text-end text-danger fw-medium"
                            th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Biểu đồ cột theo ví -->
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-3 p-3">
                <h6 class="fw-bold mb-3">
                    <i class="bi bi-bar-chart"></i> Chi tiêu theo ví
                </h6>
                <canvas id="walletChart" height="300"></canvas>

                <!-- Bảng chi tiết -->
                <table class="table table-sm mt-3">
                    <tbody>
                    <tr th:each="entry : ${walletTotals}">
                        <td th:text="${entry.key}"></td>
                        <td class="text-end text-danger fw-medium"
                            th:text="${#numbers.formatDecimal(entry.value, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Truyền dữ liệu từ Thymeleaf sang JavaScript -->
<script th:inline="javascript">
    const categoryLabels = [];
    const categoryData = [];
    /*[# th:each="entry : ${categoryTotals}"]*/
    categoryLabels.push([[${entry.key}]]);
    categoryData.push([[${entry.value}]]);
    /*[/]*/

    const walletLabels = [];
    const walletData = [];
    /*[# th:each="entry : ${walletTotals}"]*/
    walletLabels.push([[${entry.key}]]);
    walletData.push([[${entry.value}]]);
    /*[/]*/
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Màu sắc đẹp cho biểu đồ
    const colors = [
        '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
        '#9966FF', '#FF9F40', '#FF6384', '#C9CBCF'
    ];

    // Biểu đồ tròn — danh mục
    new Chart(document.getElementById('categoryChart'), {
        type: 'doughnut',
        data: {
            labels: categoryLabels,
            datasets: [{
                data: categoryData,
                backgroundColor: colors,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { position: 'bottom' }
            }
        }
    });

    // Biểu đồ cột — ví
    new Chart(document.getElementById('walletChart'), {
        type: 'bar',
        data: {
            labels: walletLabels,
            datasets: [{
                label: 'Chi tiêu (₫)',
                data: walletData,
                backgroundColor: colors,
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        callback: value =>
                            new Intl.NumberFormat('vi-VN').format(value) + ' ₫'
                    }
                }
            }
        }
    });
</script>
</body>
</html>
