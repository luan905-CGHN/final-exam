<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Giao dịch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-wallet2"></i> Chi Tiêu
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
            <a class="nav-link text-white" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Trang chủ
            </a>
            <a class="nav-link text-white" th:href="@{/categories}">
                <i class="bi bi-tags"></i> Danh mục
            </a>
            <a class="nav-link text-white" th:href="@{/statistics}">
                <i class="bi bi-bar-chart"></i> Thống kê
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name"></span>
            </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${error}"></span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <i class="bi bi-list-ul"></i> Giao dịch
        </h5>
        <button class="btn btn-primary btn-sm"
                data-bs-toggle="modal" data-bs-target="#addTransactionModal">
            <i class="bi bi-plus-lg"></i> Thêm khoản chi
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-3 p-3 mb-3">
        <form th:action="@{/transactions}" method="get" class="row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small fw-medium">Từ ngày</label>
                <input type="date" name="startDate" class="form-control form-control-sm"
                       th:value="${today}">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-medium">Đến ngày</label>
                <input type="date" name="endDate" class="form-control form-control-sm"
                       th:value="${today}">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-medium">Ví</label>
                <select name="walletId" class="form-select form-select-sm">
                    <option value="">Tất cả ví</option>
                    <option th:each="w : ${wallets}"
                            th:value="${w.id}"
                            th:text="${w.name}">Ví</option>
                </select>
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary btn-sm w-100">
                    <i class="bi bi-search"></i> Lọc
                </button>
            </div>
        </form>
    </div>

    <div class="alert alert-info py-2 mb-3">
        <i class="bi bi-calculator"></i>
        Tổng chi: <strong th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</strong>
    </div>

    <div class="card border-0 shadow-sm rounded-3">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>STT</th>
                    <th>Ngày</th>
                    <th>Danh mục</th>
                    <th>Ví</th>
                    <th>Ghi chú</th>
                    <th class="text-end">Số tiền</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="7" class="text-center py-4 text-muted">
                        Chưa có giao dịch nào
                    </td>
                </tr>
                <tr th:each="t, stat : ${transactions}" class="transaction-row">
                    <td th:text="${stat.index + 1}">1</td>
                    <td th:text="${#temporals.format(t.transactionDate, 'dd/MM/yyyy')}">01/01/2026</td>
                    <td>
                        <span th:text="${t.categoryIcon}">🍜</span>
                        <span th:text="${t.categoryName}">Ăn uống</span>
                    </td>
                    <td th:text="${t.walletName}">Ví</td>
                    <td th:text="${t.note}">Ghi chú</td>
                    <td class="text-end fw-medium text-danger"
                        th:text="${#numbers.formatDecimal(t.amount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                        0 ₫
                    </td>
                    <td>
                        <div class="d-flex gap-1">
                            <button class="btn btn-outline-primary btn-sm"
                                    th:data-id="${t.id}"
                                    th:data-amount="${t.amount}"
                                    th:data-note="${t.note}"
                                    onclick="openEditTransactionModal(this)"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editTransactionModal">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <form th:action="@{/transactions/{id}/delete(id=${t.id})}"
                                  method="post"
                                  onsubmit="return confirm('Xoá khoản chi này? Tiền sẽ hoàn về ví!')">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal thêm khoản chi -->
<div class="modal fade" id="addTransactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-plus-lg"></i> Thêm khoản chi
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/transactions}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Số tiền *</label>
                        <input type="number" name="amount" class="form-control"
                               placeholder="VD: 50000" min="1000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Danh mục *</label>
                        <select name="categoryId" class="form-select" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.icon} + ' ' + ${c.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ví *</label>
                        <select name="walletId" class="form-select" required>
                            <option value="">-- Chọn ví --</option>
                            <option th:each="w : ${wallets}"
                                    th:value="${w.id}"
                                    th:text="${w.icon} + ' ' + ${w.name} + ' (' + ${#numbers.formatDecimal(w.balance, 0, 'COMMA', 0, 'POINT')} + ' ₫)'">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ghi chú</label>
                        <input type="text" name="note" class="form-control"
                               placeholder="VD: Ăn trưa với bạn">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ngày chi</label>
                        <input type="date" name="transactionDate" class="form-control"
                               th:value="${today}">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Thêm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal sửa giao dịch -->
<div class="modal fade" id="editTransactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-pencil"></i> Sửa khoản chi
                </h5>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal"></button>
            </div>
            <form id="editTransactionForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Số tiền *</label>
                        <input type="number" id="editAmount" name="amount"
                               class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Danh mục *</label>
                        <select name="categoryId" class="form-select" required>
                            <option th:each="c : ${categories}"
                                    th:value="${c.id}"
                                    th:text="${c.icon} + ' ' + ${c.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ví *</label>
                        <select name="walletId" class="form-select" required>
                            <option th:each="w : ${wallets}"
                                    th:value="${w.id}"
                                    th:text="${w.name}">
                            </option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ghi chú</label>
                        <input type="text" id="editNote" name="note"
                               class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ngày chi</label>
                        <input type="date" id="editDate" name="transactionDate"
                               class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openEditTransactionModal(btn) {
        const id = btn.getAttribute('data-id');
        const amount = btn.getAttribute('data-amount');
        const note = btn.getAttribute('data-note');
        document.getElementById('editAmount').value = amount;
        document.getElementById('editNote').value = note || '';
        document.getElementById('editTransactionForm').action =
            '/transactions/' + id + '/edit';
    }
</script>
</body>
</html>
