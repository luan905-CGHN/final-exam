<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-wallet2"></i> Chi Tiêu
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
            <a class="nav-link text-white" th:href="@{/dashboard}">
                <i class="bi bi-house"></i> Trang chủ
            </a>
            <a class="nav-link text-white" th:href="@{/transactions}">
                <i class="bi bi-list-ul"></i> Giao dịch
            </a>
            <a class="nav-link text-white" th:href="@{/statistics}">
                <i class="bi bi-bar-chart"></i> Thống kê
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i>
                <span sec:authentication="name"></span>
            </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <i class="bi bi-tags"></i> Danh mục chi tiêu
        </h5>
        <button class="btn btn-primary btn-sm"
                data-bs-toggle="modal" data-bs-target="#addCategoryModal">
            <i class="bi bi-plus-lg"></i> Thêm danh mục
        </button>
    </div>

    <!-- Thông báo lỗi -->
    <div th:if="${error}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Danh sách danh mục -->
    <div class="row g-3">
        <div th:if="${#lists.isEmpty(categories)}" class="col-12">
            <div class="text-center py-5 text-muted">
                <i class="bi bi-tags" style="font-size: 3rem;"></i>
                <p class="mt-2">Chưa có danh mục nào!</p>
            </div>
        </div>

        <div th:each="cat : ${categories}" class="col-md-4">
            <div class="card border-0 shadow-sm rounded-3 p-3">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="d-flex align-items-center gap-2">
                        <span class="fs-4" th:text="${cat.icon}">🏷️</span>
                        <div>
                            <div class="fw-medium" th:text="${cat.name}">Tên</div>
                            <div class="text-muted small" th:text="${cat.note}">Ghi chú</div>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm"
                                th:data-id="${cat.id}"
                                th:data-name="${cat.name}"
                                th:data-note="${cat.note}"
                                th:data-icon="${cat.icon}"
                                onclick="openEditModal(this)"
                                data-bs-toggle="modal"
                                data-bs-target="#editCategoryModal">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/categories/{id}/delete(id=${cat.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('Xoá danh mục này sẽ xoá toàn bộ giao dich liên quan! bạn có chắc chắn không?')">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal thêm danh mục -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-plus-lg"></i> Thêm danh mục
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/categories}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Tên danh mục *</label>
                        <input type="text" name="name" class="form-control"
                               placeholder="VD: Ăn uống" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ghi chú</label>
                        <input type="text" name="note" class="form-control"
                               placeholder="VD: Chi phí ăn uống hàng ngày">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Icon</label>
                        <select name="icon" class="form-select">
                            <option value="🍜">🍜 Ăn uống</option>
                            <option value="☕">☕ Cafe</option>
                            <option value="🛍️">🛍️ Mua sắm</option>
                            <option value="⛽">⛽ Xăng xe</option>
                            <option value="🏠">🏠 Nhà ở</option>
                            <option value="💊">💊 Y tế</option>
                            <option value="📚">📚 Học tập</option>
                            <option value="🎮">🎮 Giải trí</option>
                            <option value="✈️">✈️ Du lịch</option>
                            <option value="💡">💡 Điện nước</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Thêm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal sửa danh mục -->
<div class="modal fade" id="editCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-pencil"></i> Sửa danh mục
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Tên danh mục *</label>
                        <input type="text" id="editName" name="name"
                               class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ghi chú</label>
                        <input type="text" id="editNote" name="note" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Icon</label>
                        <input type="text" id="editIcon" name="icon" class="form-control">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openEditModal(btn) {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        const note = btn.getAttribute('data-note');
        const icon = btn.getAttribute('data-icon');
        document.getElementById('editName').value = name;
        document.getElementById('editNote').value = note || '';
        document.getElementById('editIcon').value = icon || '';
        document.getElementById('editForm').action = '/categories/' + id + '/edit';
    }
</script>
</body>
</html>
