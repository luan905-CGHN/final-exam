<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <i class="bi bi-wallet2 text-primary" style="font-size: 3rem;"></i>
                <h2 class="fw-bold text-primary mt-2">Quản lý Chi Tiêu</h2>
            </div>
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4">
                    <h4 class="card-title mb-4 text-center">Đăng ký tài khoản</h4>

                    <div th:if="${error}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-circle"></i>
                        <span th:text="${error}"></span>
                    </div>

                    <form th:action="@{/auth/register}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Username <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-person"></i>
                                </span>
                                <input type="text" name="username"
                                       class="form-control"
                                       placeholder="Nhập username"
                                       required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Email <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" name="email"
                                       class="form-control"
                                       placeholder="example@gmail.com"
                                       required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium">
                                Mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>
                                <input type="password" name="password"
                                       class="form-control"
                                       placeholder="6-8 ký tự"
                                       required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium">
                                Nhập lại mật khẩu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock-fill"></i>
                                </span>
                                <input type="password" name="rePassword"
                                       class="form-control"
                                       placeholder="Nhập lại mật khẩu"
                                       required>
                            </div>
                        </div>
                        <button type="submit"
                                class="btn btn-primary w-100 py-2 fw-medium">
                            <i class="bi bi-person-plus"></i> Đăng ký
                        </button>
                    </form>

                    <hr>
                    <p class="text-center text-muted mb-0">
                        Đã có tài khoản?
                        <a th:href="@{/auth/login}" class="text-primary fw-medium">
                            Đăng nhập
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
