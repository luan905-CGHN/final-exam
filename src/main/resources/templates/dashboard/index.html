<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-wallet2"></i> Chi Tiêu
        </a>
        <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
            <a class="nav-link text-white" th:href="@{/transactions}">
                <i class="bi bi-list-ul"></i> Giao dịch
            </a>
            <a class="nav-link text-white" th:href="@{/categories}">
                <i class="bi bi-tags"></i> Danh mục
            </a>
            <a class="nav-link text-white" th:href="@{/statistics}">
                <i class="bi bi-bar-chart"></i> Thống kê
            </a>
            <span class="text-white">
                <i class="bi bi-person-circle"></i>
            <span th:text="${displayName != null} ? ${displayName} : ${#authentication.name}"></span>
            </span>
            <form th:action="@{/auth/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-box-arrow-right"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <!-- Tổng tiền (ID 5) -->
    <div class="total-balance-card mb-4">
        <div class="text-white opacity-75 mb-1">Tổng số dư</div>
        <div class="amount" th:text="${#numbers.formatDecimal(totalBalance, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
            0 ₫
        </div>
        <div class="text-white opacity-75 mt-1">
            <i class="bi bi-wallet2"></i>
            <span th:text="${wallets.size()} + ' ví'">0 ví</span>
        </div>
    </div>

    <!-- Tiêu đề + nút thêm ví -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">
            <i class="bi bi-wallet2"></i> Ví của tôi
        </h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addWalletModal">
            <i class="bi bi-plus-lg"></i> Thêm ví
        </button>
    </div>

    <!-- Danh sách ví (ID 4) -->
    <div class="row g-3 mb-4">
        <!-- Nếu chưa có ví -->
        <div th:if="${#lists.isEmpty(wallets)}" class="col-12">            <div class="text-center py-5 text-muted">
                <i class="bi bi-wallet2" style="font-size: 3rem;"></i>
                <p class="mt-2">Chưa có ví nào. Hãy thêm ví đầu tiên!</p>
            </div>
        </div>

        <!-- Hiển thị từng ví -->
        <div th:each="wallet : ${wallets}" class="col-md-4">
            <div class="card wallet-card p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fs-4" th:text="${wallet.icon}">💵</span>
                    <span class="text-muted small" th:text="${wallet.name}">Ví</span>
                </div>
                <div class="balance" th:text="${#numbers.formatDecimal(wallet.balance, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                    0 ₫
                </div>
                <div class="text-muted small mt-1">
                    Đã nạp: <span th:text="${#numbers.formatDecimal(wallet.totalDeposited, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</span>
                </div>
                <!-- Nút nạp tiền -->
                <button class="btn btn-success btn-sm mt-2"
                        th:data-wallet-id="${wallet.id}"
                        th:data-wallet-name="${wallet.name}"
                        onclick="openDepositModal(this)"
                        data-bs-toggle="modal" data-bs-target="#depositModal">
                    <i class="bi bi-plus-circle"></i> Nạp tiền
                </button>
                <div class="d-flex gap-2 mt-1">
                    <button class="btn btn-outline-primary btn-sm flex-fill"
                            th:data-id="${wallet.id}"
                            th:data-name="${wallet.name}"
                            th:data-description="${wallet.description}"
                            th:data-icon="${wallet.icon}"
                            onclick="openEditWalletModal(this)"
                            data-bs-toggle="modal" data-bs-target="#editWalletModal">
                        <i class="bi bi-pencil"></i> Sửa
                    </button>
                    <form th:action="@{/wallets/{id}/delete(id=${wallet.id})}" method="post" class="flex-fill">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-danger btn-sm w-100"
                                onclick="return confirm('Xoá ví này? Toàn bộ giao dịch cũng bị xoá!')">
                            <i class="bi bi-trash"></i> Xoá
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal thêm ví -->
<div class="modal fade" id="addWalletModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-plus-lg"></i> Thêm ví mới
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/wallets}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Tên ví *</label>
                        <input type="text" name="name" class="form-control"
                               placeholder="VD: Ví tiền mặt" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Mô tả</label>
                        <input type="text" name="description" class="form-control"
                               placeholder="VD: Tiền mặt hàng ngày">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Icon</label>
                        <select name="icon" class="form-select">
                            <option value="💵">💵 Tiền mặt</option>
                            <option value="💳">💳 Thẻ ngân hàng</option>
                            <option value="🏦">🏦 Ngân hàng</option>
                            <option value="👛">👛 Ví</option>
                            <option value="💰">💰 Tiết kiệm</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Thêm ví</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal sửa ví -->
<div class="modal fade" id="editWalletModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-pencil"></i> Sửa ví
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="editWalletForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label fw-medium">Tên ví *</label>
                        <input type="text" id="editWalletName" name="name"
                               class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Mô tả</label>
                        <input type="text" id="editWalletDesc" name="description"
                               class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Icon</label>
                        <select id="editWalletIcon" name="icon" class="form-select">
                            <option value="💵">💵 Tiền mặt</option>
                            <option value="💳">💳 Thẻ ngân hàng</option>
                            <option value="🏦">🏦 Ngân hàng</option>
                            <option value="👛">👛 Ví</option>
                            <option value="💰">💰 Tiết kiệm</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal nạp tiền -->
<div class="modal fade" id="depositModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-white">
                    <i class="bi bi-plus-circle"></i> Nạp tiền vào ví
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="depositForm" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="modal-body">
                    <p>Ví: <strong id="depositWalletName"></strong></p>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Số tiền *</label>
                        <input type="number" name="amount" class="form-control"
                               placeholder="VD: 500000" min="1000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-medium">Ghi chú</label>
                        <input type="text" name="note" class="form-control"
                               placeholder="VD: Lương tháng 5">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
                    <button type="submit" class="btn btn-success">Nạp tiền</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function openDepositModal(btn) {
        const walletId = btn.getAttribute('data-wallet-id');
        const walletName = btn.getAttribute('data-wallet-name');
        document.getElementById('depositWalletName').textContent = walletName;
        document.getElementById('depositForm').action = '/wallets/' + walletId + '/deposit';
    }
    function openEditWalletModal(btn) {
        const id = btn.getAttribute('data-id');
        const name = btn.getAttribute('data-name');
        const desc = btn.getAttribute('data-description');
        const icon = btn.getAttribute('data-icon');
        document.getElementById('editWalletName').value = name;
        document.getElementById('editWalletDesc').value = desc || '';
        document.getElementById('editWalletIcon').value = icon || '💵';
        document.getElementById('editWalletForm').action = '/wallets/' + id + '/edit';
    }
</script>
</body>
</html>
